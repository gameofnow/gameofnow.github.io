<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Game Øf Now</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #111111;
      --soft-ink: rgba(17, 17, 17, 0.55);
      --wine: #990033;
      --paper: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      width: 100%;
      background: var(--paper);
      font-family: "Cormorant Garamond", "EB Garamond", Georgia, serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .logo {
      position: absolute;
      top: 36px;
      left: 56px;
      width: 70px;
      height: 70px;
      z-index: 5;
    }

    .bg-mark {
      position: fixed;
      top: 50%;
      right: -650px;
      transform: translateY(-50%);
      width: 1600px;
      height: 1600px;
      opacity: 0.06;
      pointer-events: none;
      z-index: 0;
      user-select: none;
    }

    .bg-mark img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .page,
    .logo {
      position: relative;
      z-index: 1;
    }

    .logo {
      position: absolute;
      z-index: 5;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 60fr 40fr;
      padding: 140px 56px 64px;
      gap: 48px;
      align-items: center;
    }

    .left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 720px;
    }

    .statement {
      font-size: clamp(28px, 4.2vw, 64px);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.005em;
      font-style: italic;
      color: var(--ink);
    }

    .right {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .cta {
      display: inline-block;
      font-family: "Space Grotesk", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(30px, 3.6vw, 48px);
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: clamp(26px, 3vw, 36px) clamp(64px, 7vw, 104px);
      background: linear-gradient(135deg, #6E0023 0%, #E91E63 100%);
      color: #ffffff;
      border: 4px solid #000000;
      border-radius: 999px;
      text-decoration: none;
      cursor: pointer;
      transition: background 220ms ease, color 220ms ease, transform 180ms ease, box-shadow 180ms ease;
      animation: ctaBreath 1.8s ease-in-out infinite;
      will-change: transform, box-shadow;
    }

    @keyframes ctaBreath {
      0%, 100% {
        transform: scale(1) translateY(0);
        box-shadow: 6px 8px 6px rgba(0, 0, 0, 0.55);
      }
      50% {
        transform: scale(1.05) translateY(-4px);
        box-shadow: 10px 14px 10px rgba(0, 0, 0, 0.6);
      }
    }

    .cta:hover, .cta:focus {
      background: linear-gradient(135deg, #ffffff 0%, #ffffff 100%);
      color: var(--wine);
      animation-play-state: paused;
      transform: scale(1.07) translateY(-8px);
      box-shadow: 14px 18px 14px rgba(0, 0, 0, 0.65);
      outline: none;
    }

    .cta-secondary {
      display: inline-block;
      font-family: "Space Grotesk", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(14px, 1.6vw, 20px);
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: clamp(12px, 1.4vw, 18px) clamp(28px, 3.2vw, 48px);
      background: var(--paper);
      color: var(--soft-ink);
      border: 2px solid rgba(17,17,17,0.25);
      border-radius: 999px;
      text-decoration: none;
      cursor: pointer;
      transition: color 220ms ease, border-color 220ms ease, transform 180ms ease;
    }

    .cta-secondary:hover, .cta-secondary:focus {
      color: var(--wine);
      border-color: var(--wine);
      transform: translateY(-2px);
      outline: none;
    }

    @media (max-width: 820px) {
      .page {
        grid-template-columns: 1fr;
        padding: 120px 28px 48px;
        gap: 56px;
      }
      .logo { width: 56px; height: 56px; top: 24px; left: 28px; }
      .left { max-width: none; }
      .right { padding: 16px 0 32px; }
      .bg-mark {
        width: 900px;
        height: 900px;
        right: -260px;
        opacity: 0.04;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cta { animation: none; }
    }
  
    /* ── Donation Banner ── */
    .top-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: #990033;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 9px 48px;
    }
    .banner-text {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(13px, 1.4vw, 16px);
      font-style: italic;
      color: #ffffff;
      line-height: 1.3;
    }
    .banner-btn {
      font-family: "Space Grotesk", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #990033;
      background: #ffffff;
      padding: 6px 18px;
      border-radius: 999px;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 180ms ease, color 180ms ease;
    }
    .banner-btn:hover {
      background: #00b341;
      color: #ffffff;
    }
    /* push logo below banner */
    .logo { top: 84px !important; }
    /* push page content down to clear logo */
    .page { padding-top: 160px !important; }
    @media (max-width: 700px) {
      .top-banner { padding: 8px 20px; gap: 10px; }
      .logo { top: 68px !important; }
      .page { padding-top: 140px !important; }
    }
</style>
</head>
<body>
  <div class="top-banner">
    <span class="banner-text">Please support the development of our work at The Game Øf Now</span>
    <a href="donate.html" class="banner-btn">Donate</a>
  </div>

  <div class="bg-mark" aria-hidden="true">
    <img src="ring-logo.png" alt="">
  </div>

  <a href="index.html"><img src="ring-logo.png" alt="The Game Øf Now" class="logo"></a>

  <main class="page">
    <div class="left">
      <p class="statement">Forgetting to play is the only way out.</p>
    </div>

    <div class="right">
      <a href="games.html" class="cta">PLAY</a>
      <a href="dont-play.html" class="cta-secondary">← Back</a>
    </div>
  </main>
</body>
</html>
