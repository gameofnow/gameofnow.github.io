<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Game Øf Now</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #111111;
      --soft-ink: rgba(17, 17, 17, 0.55);
      --wine: #990033;
      --paper: #ffffff;
      --rule: rgba(17,17,17,0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      width: 100%;
      background: var(--paper);
      font-family: "Cormorant Garamond", Georgia, serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .logo {
      position: absolute;
      top: 36px;
      left: 56px;
      width: 70px;
      height: 70px;
      z-index: 5;
    }

    .bg-mark {
      position: fixed;
      top: 50%;
      right: -650px;
      transform: translateY(-50%);
      width: 1600px;
      height: 1600px;
      opacity: 0.06;
      pointer-events: none;
      z-index: 0;
      user-select: none;
    }

    .bg-mark img { width: 100%; height: 100%; display: block; }

    .page {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0 auto;
      padding: 140px 56px 120px;
    }

    .title {
      font-size: clamp(34px, 6vw, 88px);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -0.005em;
      margin-bottom: 0.9em;
      white-space: nowrap;
    }

    .prefix {
      font-size: clamp(22px, 2.6vw, 36px);
      color: var(--soft-ink);
      letter-spacing: 0.01em;
      margin-bottom: 0.4em;
      font-weight: 400;
    }

    .rotating {
      font-size: clamp(40px, 5vw, 72px);
      font-style: italic;
      color: var(--wine);
      font-weight: 500;
      line-height: 1.15;
      min-height: 1.4em;
      margin-bottom: 3.2em;
    }

    .cursor {
      display: inline-block;
      font-style: normal;
      color: var(--wine);
      margin-left: 0.05em;
      animation: blink 0.9s step-end infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }

    /* Form */
    .form-label {
      font-size: clamp(20px, 2.4vw, 30px);
      font-weight: 400;
      line-height: 1.5;
      margin-bottom: 1.8em;
    }

    .form-label sup {
      font-size: 0.65em;
      color: var(--wine);
    }

    .form-fields {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
    }

    .form-fields input {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(18px, 2vw, 24px);
      font-weight: 400;
      color: var(--ink);
      background: transparent;
      border: none;
      border-bottom: 1.5px solid var(--rule);
      padding: 12px 0;
      width: 100%;
      outline: none;
      transition: border-color 200ms ease;
    }

    .form-fields input::placeholder {
      color: rgba(17,17,17,0.3);
      font-style: italic;
    }

    .form-fields input:focus { border-bottom-color: var(--wine); }

    .submit-btn {
      font-family: "Space Grotesk", sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ffffff;
      background: var(--wine);
      border: none;
      border-radius: 999px;
      padding: 16px 44px;
      cursor: pointer;
      transition: background 200ms ease, transform 150ms ease;
    }

    .submit-btn:hover {
      background: var(--ink);
      transform: translateY(-2px);
    }

    .footnote {
      margin-top: 4em;
      font-size: clamp(13px, 1.3vw, 16px);
      font-style: italic;
      color: rgba(17,17,17,0.4);
      line-height: 1.6;
      border-top: 1px solid var(--rule);
      padding-top: 1.6em;
    }

    .footnote sup { color: var(--wine); font-size: 0.75em; }

    @media (max-width: 700px) {
      .logo { width: 56px; height: 56px; top: 24px; left: 28px; }
      .page { padding: 120px 28px 80px; }
      .bg-mark { width: 900px; height: 900px; right: -260px; opacity: 0.04; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; opacity: 1; }
    }
  
    /* ── Donation Banner ── */
    .top-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: #990033;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 9px 48px;
    }
    .banner-text {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(13px, 1.4vw, 16px);
      font-style: italic;
      color: #ffffff;
      line-height: 1.3;
    }
    .banner-btn {
      font-family: "Space Grotesk", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #990033;
      background: #ffffff;
      padding: 6px 18px;
      border-radius: 999px;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 180ms ease, color 180ms ease;
    }
    .banner-btn:hover {
      background: #00b341;
      color: #ffffff;
    }
    /* push logo below banner */
    .logo { top: 84px !important; }
    /* push page content down to clear logo */
    .page { padding-top: 160px !important; }
    @media (max-width: 700px) {
      .top-banner { padding: 8px 20px; gap: 10px; }
      .logo { top: 68px !important; }
      .page { padding-top: 140px !important; }
    }
</style>
</head>
<body>
  <div class="top-banner">
    <span class="banner-text">Please support the development of our work at The Game Øf Now</span>
    <a href="donate.html" class="banner-btn">Donate</a>
  </div>


  <div class="bg-mark" aria-hidden="true">
    <img src="ring-logo.png" alt="">
  </div>

  <img src="ring-logo.png" alt="The Game Øf Now" class="logo">

  <main class="page">

    <h1 class="title">The Game Øf Now</h1>

    <p class="prefix">Now is the time to</p>
    <p class="rotating"><span id="phrase"></span><span class="cursor">|</span></p>

    <p class="form-label">
      Please enter the name of your nearest body of water and your email address to receive 1,000 pounds<sup>*</sup>
    </p>

    <form class="form-fields" id="signup-form" onsubmit="handleSubmit(event)">
      <input type="text" id="water" name="water" placeholder="nearest body of water" autocomplete="off" required>
      <input type="email" id="email" name="email" placeholder="your email address" autocomplete="email" required>
    </form>

    <button class="submit-btn" onclick="handleSubmit(event)">Send</button>

    <p class="footnote">
      <sup>*</sup> 1,000 pounds by weight, of good ideas, accessible via a telepathic field near you.
    </p>

  </main>

  <script>
    const phrases = [
      "listen attentively",
      "play boldly",
      "breathe consciously",
      "forgive appropriately",
      "begin yet again",
      "stand on your head",
      "speak up",
      "love openly",
      "cooperate spontaneously",
      "stop boozing",
      "press that button over there!",
      "rest fully",
      "get to know your neighbours",
      "create freshly",
      "notice clearly",
      "arrive home",
      "hug yourself",
      "hug your child",
      "clean up",
      "grow up",
      "show up",
      "wake up",
      "take the trash out",
      "upskill",
      "let go gently",
      "step forward",
      "choose differently",
      "ask honestly",
      "throw a wobbly",
      "put the damn phone down",
      "act simply",
      "walk slowly",
      "talk to your Ma",
      "laugh with your Da",
      "mow the lawn",
      "see clearly",
      "be silent",
      "start over",
      "eat your greens",
      "wake up gently",
      "look over your shoulder",
      "say no to you know what",
      "listen within",
      "trust deeply",
      "play together",
      "swear you will never do that again",
      "live boldly",
      "feel everything",
      "know yourself",
      "show up fully",
      "feed the cat",
      "collude"
    ];

    const el = document.getElementById("phrase");
    let pi = 0, pc = 0, pd = false;

    function tick() {
      const cur = phrases[pi];
      if (!pd) {
        pc++;
        el.textContent = cur.substring(0, pc);
        if (pc === cur.length) {
          setTimeout(() => { pd = true; tick(); }, 2800);
          return;
        }
      } else {
        pc--;
        el.textContent = cur.substring(0, pc);
        if (pc === 0) {
          pd = false;
          pi = (pi + 1) % phrases.length;
          setTimeout(tick, 500);
          return;
        }
      }
      setTimeout(tick, pd ? 24 : 72);
    }

    tick();

    function handleSubmit(e) {
      e.preventDefault();
      const water = document.getElementById('water').value.trim();
      const email = document.getElementById('email').value.trim();
      if (!water || !email) return;
      const subject = encodeURIComponent('1,000 pounds — sign me up');
      const body = encodeURIComponent(
        'Nearest body of water: ' + water + '\n\nMy email: ' + email + '\n\n'
      );
      window.location.href = 'mailto:play@gameofnow.com?subject=' + subject + '&body=' + body;
    }
  </script>

  <script src="/menu.js" defer></script>
</body>
</html>
